<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/cloudinary-video-player@3.4.2/dist/cld-video-player.min.css"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
/>
<script
  src="https://cdn.jsdelivr.net/npm/cloudinary-video-player@3.4.2/dist/cld-video-player.min.js"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
></script>

<script defer>
  function renderVideoElement(videoPlayerElement) {
    const currentVideoId =videoPlayerElement.getAttribute('id')
    const videoPlayerId = `${currentVideoId}` + '-sfe-' + Math.random().toString(36).substr(2,9)
    videoPlayerElement.setAttribute('id', videoPlayerId)
    const cloudName = videoPlayerElement.dataset.cloudName
    const videoUrl = videoPlayerElement.dataset.videoUrl
    if (cloudName && videoUrl) {
      const cld = cloudinary.videoPlayer(videoPlayerId, {
        cloudName: cloudName
      })
      cld.source(videoUrl)
    }
  }

  function renderAllVideo() {
    const videoPlayerClassName = 'sfe-video'
    const videoPlayerElements = document.getElementsByClassName(videoPlayerClassName)
    for (let el of videoPlayerElements) {
      renderVideoElement(el)
    }
  }

  document.addEventListener('DOMContentLoaded', renderAllVideo)
</script>
